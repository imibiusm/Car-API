
site_name: Car Database API
site_description: Documentation for the Car Database API
site_url: https://imibiusm.github.io/Car-API/
repo_name: imibiusm/Car-API
repo_url: https://github.com/imibiusm/car-api-docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: darkblue
      accent: cyan

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference: endpoints.md
